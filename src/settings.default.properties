# Plugin log level.
# Possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
# Example for normal operation: logLevel=INFO
# Example for troubleshooting deposits or event matching: logLevel=DEBUG
logLevel=ALL

# Send the plugin welcome/help hint to players when they spawn.
# true  = players see the short plugin hint after joining
# false = no automatic welcome message
sendPluginWelcome=false

# Daily login reward.
# A player can receive this once per GMT/UTC calendar date.
# The reward is deposited into OZ Wallet's default currency.
dailyLogin.enabled=true

# Base amount used by the login streak formula.
# Formula: floor(baseBonus * factor ^ min(streakCount, streakLimit))
# Example with baseBonus=10, factor=1.10:
# streak 1 => floor(10 * 1.10^1) = 11
# streak 2 => floor(10 * 1.10^2) = 12
dailyLogin.baseBonus=10

# Streak multiplier.
# 1.0 disables growth and always pays the base amount.
# 1.10 means each continued login streak step increases the calculated amount by 10%.
dailyLogin.factor=1.10

# Maximum exponent used by the streak formula.
# The stored streak can continue growing, but the payout is capped at this multiplier step.
# Example: streakLimit=7 caps the payout calculation from day 7 onward.
dailyLogin.streakLimit=7

# Enemy NPC kill rewards.
# Enemy NPCs are detected by type ID or by matching configured text fragments against the NPC definition name.
# Matching is case-insensitive and uses "contains", so "bandit" also matches "desert_bandit".
enemyNpcKill.enabled=true

# Default reward for a matched enemy NPC kill.
enemyNpcKill.reward=10

# Comma-separated NPC type IDs treated as rewardable enemy NPCs.
# Defaults:
# 210 = bandit
# 215 = desert bandit
# Examples:
# enemyNpcKill.typeIds=210,215
# enemyNpcKill.typeIds=210,215,216
enemyNpcKill.typeIds=210,215

# Comma-separated definition-name fragments treated as rewardable enemy NPCs.
# Examples:
# enemyNpcKill.definitionNames=bandit,skeleton
enemyNpcKill.definitionNames=bandit,skeleton

# Optional comma-separated reward overrides by definition-name fragment.
# Format: fragment=amount,fragment=amount
# Matching is case-insensitive and uses "contains".
# Examples:
# enemyNpcKill.rewardOverrides=bandit=10,skeleton=5
enemyNpcKill.rewardOverrides=

# Aggressive animal kill rewards.
# The plugin only pays this when the killed NPC is an animal with aggressive behaviour.
aggressiveAnimalKill.enabled=true

# Default reward for an aggressive animal kill.
aggressiveAnimalKill.reward=5

# Optional comma-separated reward overrides by animal definition-name fragment.
# Format: fragment=amount,fragment=amount
# Examples:
# aggressiveAnimalKill.rewardOverrides=bear=25,wolf=15
# aggressiveAnimalKill.rewardOverrides=polar_bear=40
aggressiveAnimalKill.rewardOverrides=

# Lightning/storm/hurricane reward.
# Rising World currently exposes lightning-like damage as generic environment damage.
# This plugin only pays when environment damage happens during thunder, storm, or hurricane weather.
lightning.enabled=true

# Reward paid after the storm/lightning workaround triggers.
lightning.reward=2500

# Global announcement type for lightning rewards.
# Possible values:
# yell = broadcast as yell message
# chat = broadcast as normal chat message
lightning.messageType=yell

# First orbit visit reward.
# A player receives this once after reaching at least the configured vertical chunk.
# The hidden player setting oz.rewards.milestone.orbit.reachedAt stores the timestamp after successful deposit.
orbit.enabled=true
orbit.chunkY=64
orbit.reward=5000

# First hell visit reward.
# A player receives this once after reaching at most the configured vertical chunk.
# The hidden player setting oz.rewards.milestone.hell.reachedAt stores the timestamp after successful deposit.
hell.enabled=true
hell.chunkY=-10
hell.reward=500

# Sector discovery rewards.
# Sector (0, 0) is ignored.
# Modes:
# firstOnly = only the first player who enters a sector receives a reward
# perPlayer = each player receives each sector once; the global first discoverer receives the multiplier
sectorDiscovery.enabled=true
sectorDiscovery.mode=perPlayer

# Base formula:
# (abs(sectorX) + abs(sectorY)) * baseReward
sectorDiscovery.baseReward=50

# Multiplier for the global first discoverer.
# In firstOnly mode, this is the payout multiplier.
# In perPlayer mode, the global first discoverer receives this multiplier and later players receive the base amount.
sectorDiscovery.firstDiscovererMultiplier=2.0

# Global announcement type for true first sector discoveries.
# Possible values:
# yell = broadcast as yell message
# chat = broadcast as normal chat message
sectorDiscovery.messageType=yell

# Optional Discord reward announcements through OZ Discord Connect.
# 0 disables Discord reward messages.
# Use a Discord text channel id to enable announcements.
# Example: discordRewardsChannelId=123456789012345678
discordRewardsChannelId=0
